plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// 1.9.1: signing — the release keystore + key.properties are COMMITTED so
// every build (local and CI) signs with the same stable key. Android refuses
// to install an update over an app signed with a different key, which broke
// the in-app updater when CI generated a fresh key per release.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('key.properties')
def hasKeystore = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withReader('UTF-8') { reader -> keystoreProps.load(reader) }
    def sf = keystoreProps.getProperty('storeFile')
    hasKeystore = sf != null && file(sf).exists()
}

android {
    namespace "hr.mediahost.solray"
    compileSdk 34

    compileOptions {
        // Required by flutter_local_notifications (java.time backport on old Androids)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "hr.mediahost.solray"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Signed with the committed release keystore via key.properties;
            // falls back to debug signing only when key.properties is missing
            // (fresh clone without the committed files / debug builds).
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
