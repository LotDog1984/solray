user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 200m;

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Real-time sync WebSocket (/api/ws): without Upgrade/Connection
            # headers nginx proxies the handshake as a plain GET and it fails.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;  # long-lived idle socket
        }

        location = /version.txt {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location / {
            try_files $uri /index.html;
            # Always revalidate static assets so UI updates reach users
            # immediately after a deploy instead of serving stale cache.
            add_header Cache-Control "no-cache";
        }
    }
}
