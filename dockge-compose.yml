# =============================================================================
#  SolRay — Dockge stack (paste-and-deploy)
# =============================================================================
#  HOW TO DEPLOY (in the Dockge web UI):
#    1. Create a new stack named "solray".
#    2. Paste THIS ENTIRE FILE into the compose editor.
#    3. EDIT the lines marked  <<< EDIT  — the secrets/settings block right
#       below this header, plus the app port in the frontend section.
#    4. Hit  Deploy.  Images are pulled from GitHub's container registry
#       automatically — nothing is cloned or built on the server.
#
#  UPDATING LATER: every code change is released as a new version (the
#  version lives in the repo's VERSION file, and new images are pushed to
#  GitHub's registry automatically on every release). To update the app:
#    1. check https://github.com/LotDog1984/solray (VERSION file) for the
#       newest version number
#    2. change the version in the two  image: ghcr.io/...  lines below
#    3. hit  Update  in Dockge
#  (Alternatively use tag :latest to always get the newest build.)
#
#  Data (database, uploaded files, notifications) is stored under
#  /mnt/docker/apps/solray/data/ and survives updates and restarts.
#
#  First run: open the app URL and register — the first account becomes
#  the admin and registration closes automatically afterwards.
#
#  VERSION HISTORY: see PROJECT.md in the repo (version log section).
#  Deployed version below = 1.0.0 (base release).
# =============================================================================

name: solray

# ---- EDIT YOUR SECRETS / SETTINGS HERE --------------------------------------
x-app-env: &app-env
  POSTGRES_PASSWORD: change-this-to-a-long-random-password  # <<< EDIT (1) database password (any long random string)
  JWT_SECRET: change-this-to-a-longer-random-secret         # <<< EDIT (2) login-token signing secret (long random string)
  CORS_ORIGINS: http://192.168.1.50:9998                    # <<< EDIT (3) the EXACT URL you open the app in the browser (http://IP-or-domain:PORT)
  NTFY_BASE_URL: http://192.168.1.50:8082                   # <<< EDIT (4) same host as (3), port 8082 (phone notifications)
# ------------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *app-env
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      # POSTGRES_PASSWORD arrives from the x-app-env block above
    volumes:
      - /mnt/docker/apps/solray/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/lotdog1984/solray-backend:1.0.0      # <<< bump version when updating
    restart: unless-stopped
    environment:
      <<: *app-env
      # POSTGRES_PASSWORD above alone is enough — the app builds its
      # database connection string from it automatically.
      STORAGE_DIR: /data/uploads
      NTFY_URL: http://ntfy:80
    volumes:
      - /mnt/docker/apps/solray/data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      ntfy:
        condition: service_started

  frontend:
    image: ghcr.io/lotdog1984/solray-frontend:1.0.0     # <<< bump version when updating
    restart: unless-stopped
    ports:
      - "9998:80"          # <<< EDIT (5) host port for the app (left side)
    depends_on:
      - backend

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    command: serve
    environment:
      <<: *app-env
      NTFY_LISTEN_HTTP: :80
    volumes:
      - /mnt/docker/apps/solray/data/ntfy:/var/cache/ntfy
    ports:
      - "8082:80"          # phone-notification port (rarely needs changing)
