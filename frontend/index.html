<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + safe-area padding in CSS: in the installed (standalone)
         app on iPhone the page runs under the notch/status bar and home
         indicator, so every layout edge pads itself with env(safe-area-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Team</title>
    <!-- PWA (1.14.0): installable on iPhone/Android/desktop home screens.
         Safari/iOS uses the apple-* meta tags; manifest drives the rest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070c20" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- standalone (not fullscreen): the status bar stays, iOS 15+ themes it
         with theme-color and the layout keeps a safe distance around it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Team" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app"></main>
    <script src="/app.js"></script>
  </body>
</html>
