name: Build Android APK

# Builds the SolRay mobile app on every version tag (and manually from the
# Actions tab) and attaches the signed APK to the GitHub Release — the same
# "one tag ships everything" flow as the Docker images.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the release / upload the APK asset

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # 1.12.0: FCM push — write the Firebase Android config from the repo
      # secret when present. Without the secret the APK still builds (the
      # Gradle plugin stays off and the app falls back to ntfy notifications).
      - name: Write Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p mobile/android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            python3 -c "import json; json.load(open('mobile/android/app/google-services.json')); print('google-services.json: valid JSON')"
          else
            echo "::notice::GOOGLE_SERVICES_JSON secret not set — building APK without FCM push (ntfy only)"
          fi

      - name: Read version
        id: ver
        run: echo "version=$(head -1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is verified against (local analyze/test/apk
          # all pass on it). Newer Flutter adds new analyzer lints that would fail CI.
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - name: Sync app version from VERSION
        working-directory: mobile
        run: |
          V="${{ steps.ver.outputs.version }}"
          # versionCode must never go backwards between releases; derive it
          # from the build date so it is strictly monotonic (the old "+1"
          # kept versionCode at 1 for every release).
          CODE=$(date +%Y%m%d)
          sed -i "s/^version: .*/version: ${V}+${CODE}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Generate missing android platform files (idempotent)
        working-directory: mobile
        run: flutter create --platforms=android --org hr.mediahost --project-name solray .

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Verify committed signing key (stable across releases)
        working-directory: mobile/android
        run: |
          # 1.9.1: the release keystore is COMMITTED (app/solray-release.jks
          # + key.properties), so every build — local and CI — signs with the
          # same stable key. Never generate a per-build key here again:
          # Android refuses to install an update over an app signed with a
          # different key, which is exactly what broke the in-app updater
          # before 1.9.1 (every release rolled a fresh random key).
          test -f app/solray-release.jks || { echo "::error::committed keystore app/solray-release.jks is missing"; exit 1; }
          test -f key.properties || { echo "::error::committed key.properties is missing"; exit 1; }
          keytool -list -keystore app/solray-release.jks -storepass solray123 >/dev/null

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Assert APK is signed with the stable release key
        run: |
          # Hard gate: if the signature ever drifts from the committed key,
          # fail the release instead of shipping an APK that phones would
          # refuse to install over the previous version.
          STAMP=$(keytool -printcert -jarfile mobile/build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | grep -m1 'SHA256')
          EXPECTED='A7:87:62:6E:F4:10:98:29:E3:CE:6B:C5:6E:C0:A1:88:4A:08:C9:E6:0E:1C:2E:EC:FD:E4:F9:1F:ED:37:23:9E'
          echo "APK:      $STAMP"
          echo "Expected: SHA-256: $EXPECTED"
          case "$STAMP" in
            *"$EXPECTED"*) echo "Signature OK — updates will install over previous releases.";;
            *) echo "::error::APK is NOT signed with the stable release key — in-app update would break"; exit 1;;
          esac

      - name: Rename APK
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "dist/solray-${{ steps.ver.outputs.version }}.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/solray-*.apk
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        # For workflow_dispatch (no tag) this creates a "v<version>" release
