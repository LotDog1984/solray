plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Signing: CI writes android/key.properties (storeFile, storePassword,
// keyAlias, keyPassword) before building; local builds fall back to debug signing.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('key.properties')
def hasKeystore = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withReader('UTF-8') { reader -> keystoreProps.load(reader) }
    def sf = keystoreProps.getProperty('storeFile')
    hasKeystore = sf != null && file(sf).exists()
}

android {
    namespace "hr.mediahost.solray"
    compileSdk 34

    compileOptions {
        // Required by flutter_local_notifications (java.time backport on old Androids)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "hr.mediahost.solray"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Signed with the CI-provided (or generated) keystore when present;
            // otherwise fall back to debug signing so local builds never fail.
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
