name: Build & publish images

# Builds the backend and frontend images and publishes them to GHCR
# (GitHub's container registry) on every push to main.
# Every push = a new version: the version number lives in the VERSION file
# at the repo root. The workflow tags images with:
#   - that version (e.g. 1.0.1)
#   - latest
#   - the git commit sha
# The server pulls ghcr.io/lotdog1984/solray-backend:<version> etc.
# — no source code or build step needed on the server.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

env:
  BACKEND_IMAGE: ghcr.io/lotdog1984/solray-backend
  FRONTEND_IMAGE: ghcr.io/lotdog1984/solray-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN needs this to push to ghcr.io

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(head -1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Sync version into frontend build context
        run: cp VERSION frontend/VERSION

      # 1.12.3: zero-config FCM push — bake the Firebase service-account key
      # into the backend image so a deployed stack needs NO key file on the
      # server and NO FCM env vars. The backend auto-detects /secrets/fcm.json
      # and derives FCM_PROJECT_ID from the key itself. Without the secret
      # (forks, local builds) the image builds fine and push falls back to
      # ntfy/in-app — same behavior as before 1.12.0.
      - name: Read Firebase service-account key (build arg)
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "FCM_SERVICE_ACCOUNT_JSON is set — backend image will include the FCM key"
            # Fail loudly if the secret holds the WRONG Firebase file: the
            # Android app's google-services.json (project_info/client sections)
            # is NOT a service-account key and can never sign FCM OAuth tokens.
            # The real key (Project settings → Service accounts → Generate new
            # private key) always has client_email + private_key at top level.
            if ! printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | jq -e '.client_email | type == "string" and length > 0' >/dev/null 2>&1 \
               || ! printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | jq -e '.private_key | type == "string" and length > 100' >/dev/null 2>&1; then
              echo "::error::FCM_SERVICE_ACCOUNT_JSON is NOT a service-account key (no client_email/private_key) — paste the JSON from Firebase Project settings → Service accounts → 'Generate new private key', NOT the Android app's google-services.json"
              exit 1
            fi
            printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | jq -r '"key: valid service-account JSON for project " + (.project_id // "?")'
            # The key JSON is pretty-printed (multi-line); build args would
            # line-split it (1.12.3's first CI run died exactly that way —
            # the Dockerfile received only the opening "{"). Ship it as a
            # single-line base64 blob and decode in the Dockerfile instead.
            {
              printf 'FCM_KEY_B64='
              printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | base64 -w0 | tr -d '\n'
              echo
            } >> "$GITHUB_ENV"
          else
            echo "::notice::FCM_SERVICE_ACCOUNT_JSON secret not set — backend image ships WITHOUT the FCM key (ntfy only)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            FCM_SERVICE_ACCOUNT_JSON_B64=${{ env.FCM_KEY_B64 }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
